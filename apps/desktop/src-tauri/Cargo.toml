[package]
name = "desktop"
version = "0.1.1"
description = "BrainFlow desktop shell (Tauri 2)"
authors = ["BrainFlow"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
brainflow-vault = { path = "../../../crates/vault" }
brainflow-storage = { path = "../../../crates/storage" }
brainflow-graph = { path = "../../../crates/graph" }
brainflow-policy = { path = "../../../crates/policy" }
brainflow-sync = { path = "../../../crates/sync" }
brainflow-app-core = { path = "../../../crates/app-core" }

[dev-dependencies]
tempfile = "3"
